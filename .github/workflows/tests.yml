name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  php-81:
    name: PHP puro (8.1)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
          tools: composer:v2
      - run: composer validate --strict
      - name: Remove framework-only development requirements
        run: composer remove --dev codeigniter4/framework illuminate/config illuminate/support orchestra/testbench phpunit/phpunit --no-update
      - run: composer install --no-dev --prefer-dist --no-interaction --no-progress
      - name: Validate PHP syntax
        run: find src config examples -name '*.php' -print0 | xargs -0 -n1 php -l

  tests:
    name: Frameworks (${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']

    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - run: composer validate --strict
      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: composer test
